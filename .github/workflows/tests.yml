name: Tests

on:
  push:
    branches:
      - main
      - '*.x'
    paths: &test-paths
      - 'crypto-tracker/**'
      - '.github/workflows/tests.yml'
      # Docs, local env files and tooling configs not used by tests.
      # .env.testing is re-included because tests run with --env=testing.
      - '!**/*.md'
      - '!crypto-tracker/.env*'
      - 'crypto-tracker/.env.testing'
      - '!crypto-tracker/.editorconfig'
      - '!crypto-tracker/.gitattributes'
      - '!crypto-tracker/.gitignore'
      - '!crypto-tracker/.prettierrc'
      - '!crypto-tracker/.styleci.yml'
      - '!crypto-tracker/eslint.config.js'
  pull_request:
    branches:
      - main
      - '*.x'
    paths: *test-paths
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.2, 8.3, 8.4]

    defaults:
      run:
        working-directory: crypto-tracker

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 'lts/*'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets (Vite)
        run: npm run build

      - name: Run tests
        run: php artisan test --env=testing --ansi
